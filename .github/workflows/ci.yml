name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The real-ffmpeg tests skip unless FFMPEG_PATH names a binary; a missing ffmpeg fails this step rather than skipping them.
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          command -v ffmpeg
          echo "FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm test
