databases:
  - name: ode-db
    databaseName: ode
    plan: basic-256mb

services:
  - type: web
    name: ode
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ode-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      # PayPal sandbox app (developer.paypal.com -> Apps & Credentials). The client ID is public: the page loads PayPal's buttons with it.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      # The ID of the webhook subscribed to PAYMENT.CAPTURE.COMPLETED, pointing at /api/payments/webhook (see .env.example).
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Name=email pairs: the sandbox Personal account that pays each friend (see .env.example).
      - key: FRIEND_PAYPAL_ACCOUNTS
        sync: false
      # Starts and polls the Workflow's task runs. Create it at dashboard.render.com/u/settings (API Keys).
      - key: RENDER_API_KEY
        sync: false
      # The Workflow's slug; the web service starts the task `<slug>/make-ode`.
      - key: ODE_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: ode-workflow
          property: slug

  # The song pipeline (lyrics, compose, line windows, store) runs here as one task, `make-ode`, which the web
  # service starts and polls. Task runs must be in the database's region to reach it over the private network;
  # the database and the web service above use Render's default, oregon.
  - type: workflow
    name: ode-workflow
    runtime: node
    region: oregon
    buildCommand: npm ci
    startCommand: node src/workflow/index.ts
    envVars:
      # The entry point runs TypeScript directly, which needs Node 24 (also in .node-version).
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: ode-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
