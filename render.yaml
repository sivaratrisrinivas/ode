databases:
  - name: ode-db
    databaseName: ode
    plan: basic-256mb

services:
  - type: web
    name: ode
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ode-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
